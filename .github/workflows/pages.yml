name: GitHub Pages

# Public site at https://<user>.github.io/<repo>/ — no Cloudflare account needed.
# After the first run, if the URL 404s: Settings → Pages → Source: GitHub Actions.

on:
  push:
    branches: [main, cursor/production-readiness-d340]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site for GitHub Pages
        run: npm run build
        env:
          GITHUB_PAGES: "true"
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}

      - name: Stage Pages artifact
        run: touch out/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

      - id: deployment
        uses: actions/deploy-pages@v4
